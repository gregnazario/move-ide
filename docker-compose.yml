version: '3.8'

services:
  caddy:
    image: docker.io/library/caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      - PLAYGROUND_HOST=0.0.0.0
      - PLAYGROUND_PORT=8080
      - PLAYGROUND_TIMEOUT_SECS=10
      - PLAYGROUND_MAX_MEMORY_MB=1024
      - PLAYGROUND_MAX_DISK_MB=100
      - PLAYGROUND_CONCURRENT_PER_IP=2
      - PLAYGROUND_FRONTEND_ORIGINS=${PLAYGROUND_FRONTEND_ORIGINS:-https://move-playground.sed.fyi}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-change-me}
      - RUST_LOG=info
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=500M,mode=1777

volumes:
  caddy_data:
  caddy_config:
